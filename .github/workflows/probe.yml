name: odds-probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts", filter: "blob:none" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests==2.32.3 && python scripts/probe_odds.py
